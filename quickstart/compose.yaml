services:
  backend:
    image: ghcr.io/adamgit/civigent:latest
    ports:
      - "${PORT:-8080}:3000"
    volumes:
      # Host folders must exist before first start and be writable by the container process.
      - ./wiki-data:/app/data
      - ./snapshots:${KS_SNAPSHOT_ROOT:-/app/snapshots}
      - ${IMPORT_CONTENT_FROM:-/dev/null}:/import:ro
      # Private Git remote backup — host dir must exist (may be empty until you enable the feature).
      # See docs/backup-restore.md. SSH key / known_hosts files live under this mount.
      - ./backup-secrets:/run/secrets/civigent_backup:ro
      # ssh-agent socket (unused unless KS_BACKUP_GIT_AUTH_MODE=ssh-agent). Falls back to /dev/null.
      - ${SSH_AUTH_SOCK:-/dev/null}:/run/civigent/ssh_auth_sock
    environment:
      KS_EXTERNAL_PORT: ${PORT:-8080}
      KS_EXTERNAL_HOSTNAME: ${KS_EXTERNAL_HOSTNAME:-localhost}
      KS_SNAPSHOT_ENABLED: ${KS_SNAPSHOT_ENABLED:-true}
      KS_SNAPSHOT_ROOT: ${KS_SNAPSHOT_ROOT:-/app/snapshots}
      KS_GOVERNANCE_MODE: ${KS_GOVERNANCE_MODE:-}
      KS_FATAL_ERRORS_MODE: ${KS_FATAL_ERRORS_MODE:-}
      KS_INVOLVEMENT_PRESET: ${KS_INVOLVEMENT_PRESET:-}
      KS_AUTH_MODE: ${KS_AUTH_MODE:-}
      KS_AUTH_SECRET: ${KS_AUTH_SECRET:-}
      KS_USER_NAME: ${KS_USER_NAME:-}
      KS_USER_EMAIL: ${KS_USER_EMAIL:-}
      KS_USER_ID: ${KS_USER_ID:-}
      KS_OIDC_PUBLIC_URL: ${KS_OIDC_PUBLIC_URL:-}
      KS_MCP_PUBLIC_URL: ${KS_MCP_PUBLIC_URL:-}
      KS_MCP_PUBLIC_URL_FROM_HEADERS: ${KS_MCP_PUBLIC_URL_FROM_HEADERS:-}
      KS_OIDC_ISSUER: ${KS_OIDC_ISSUER:-}
      KS_OIDC_CLIENT_ID: ${KS_OIDC_CLIENT_ID:-}
      KS_OIDC_CLIENT_SECRET: ${KS_OIDC_CLIENT_SECRET:-}
      KS_OIDC_DISPLAY_NAME: ${KS_OIDC_DISPLAY_NAME:-}
      KS_AGENT_AUTH_POLICY: ${KS_AGENT_AUTH_POLICY:-}
      KS_AGENT_ANON_SALT: ${KS_AGENT_ANON_SALT:-}
      # Private Git remote backup — operator sets only REMOTE + AUTH_MODE in .env.
      # In-container credential paths are fixed here (not operator config).
      KS_BACKUP_GIT_REMOTE: ${KS_BACKUP_GIT_REMOTE:-}
      KS_BACKUP_GIT_AUTH_MODE: ${KS_BACKUP_GIT_AUTH_MODE:-}
      KS_BACKUP_SSH_KEY_PATH: /run/secrets/civigent_backup/civigent_backup_ssh_key
      # known_hosts pinning is opt-in: leave KS_BACKUP_KNOWN_HOSTS_ENABLED unset/empty
      # to keep the path unset; any non-empty value (conventionally "true") sets the
      # fixed path. Note compose `:+` treats "false" as set — omit the var to disable.
      KS_BACKUP_KNOWN_HOSTS_PATH: ${KS_BACKUP_KNOWN_HOSTS_ENABLED:+/run/secrets/civigent_backup/civigent_backup_known_hosts}
      # Set only when the host has an agent socket (ssh-agent mode).
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK:+/run/civigent/ssh_auth_sock}
